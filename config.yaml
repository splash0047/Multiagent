# KEEP v2 Global Configuration

pipeline_version: "v5.0"

# Budgets & Circuit Breakers
max_llm_calls: 10
latency_budget_sec:
  search: 4
  extraction: 4
  synthesis: 4
max_refinement_attempts: 2

# Thresholds
dedup_threshold: 0.88
validator_min_score: 7.0

# Extraction Limits
extractor:
  max_chunks_per_source: 3
  max_tokens_per_chunk: 500

# Scoring Weights
source_weights:
  paper: 1.2
  docs: 1.0
  blog: 0.6

# ── Hybrid LLM Cost-Routing (Phase 4) ─────────────────────
llm_routing:
  # Reasoning Tier — high-quality cloud models for complex tasks
  reasoning:
    provider: "google"
    model: "gemini-2.5-flash"
    temperature: 0.0

  # Classification Tier — local Ollama for repetitive tasks
  classification:
    provider: "ollama"
    model: "llama3.1:8b"
    base_url: "http://localhost:11434"
    temperature: 0.0

  # Fallback: if local model fails, retry with cloud
  fallback:
    enabled: true
    max_retries: 1
    provider: "google"
    model: "gemini-2.5-flash"

  # Agent-to-tier mapping
  agent_tiers:
    planner: "reasoning"
    synthesizer: "reasoning"
    verifier: "reasoning"
    extractor: "classification"
    validator: "classification"

  # Cost estimates (per 1M tokens, USD) for tracking
  cost_per_million_tokens:
    gemini-2.5-flash: 0.15
    llama3.1:8b: 0.0  # Free — local inference
